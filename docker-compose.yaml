services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: local_password
    ports:
      - "5433:5432"
    volumes:
      - task_manager_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_user -d db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  task_manager_postgres_data:
